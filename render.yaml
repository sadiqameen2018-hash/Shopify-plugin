# Render Blueprint: Dashboard → New → Blueprint → pick this repository.
# Creates the web service (Docker) and a PostgreSQL database.
# Plan names and prices change; check them on the Blueprint screen before you apply.
services:
  - type: web
    name: cod-confirm
    runtime: docker
    plan: starter            # always on; free instances sleep and miss webhooks
    region: singapore        # closest Render region to Pakistan / Gulf
    healthCheckPath: /privacy
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cod-confirm-db
          property: connectionString
      - key: SHOPIFY_APP_URL
        sync: false          # https://<your-service>.onrender.com
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: read_orders,write_orders,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false          # openssl rand -base64 32  (never change it later)
      - key: APP_COMPANY_NAME
        sync: false
      - key: SUPPORT_EMAIL
        sync: false

databases:
  - name: cod-confirm-db
    region: singapore
    plan: basic-256mb
