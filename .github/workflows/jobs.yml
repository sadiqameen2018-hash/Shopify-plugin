# Calls /jobs/run every 15 minutes: WhatsApp reminders, expiry and courier tracking.
# Add repository secrets APP_URL (e.g. https://cod-confirm.onrender.com) and CRON_SECRET
# (same value as the server's CRON_SECRET): Settings → Secrets and variables → Actions.
name: Scheduled jobs

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call /jobs/run
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets are not set yet; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 120 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/jobs/run"
